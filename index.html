<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101b2d" />
    <title>Produksi | Control Room</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#" aria-label="Produksi Control Room">
          <span class="brand-mark">P</span>
          <span><strong>PRODUKSI</strong><small>CONTROL ROOM</small></span>
        </a>
        <div class="workspace-label">WORKSPACE</div>
        <nav class="main-nav" aria-label="Navigasi utama">
          <button class="nav-link active" data-view="dashboard"><span class="nav-icon">▦</span>Dashboard</button>
          <button class="nav-link" data-view="operator"><span class="nav-icon">＋</span>Input operator</button>
          <button class="nav-link" data-view="tools"><span class="nav-icon">⌁</span>Kontrol tools</button>
          <button class="nav-link" data-view="materials"><span class="nav-icon">▤</span>Material &amp; PO</button>
          <button class="nav-link" data-view="master"><span class="nav-icon">⚙</span>Data master</button>
          <button class="nav-link" data-view="verification"><span class="nav-icon">✓</span>Verifikasi hasil</button>
          <button class="nav-link" data-view="reports"><span class="nav-icon">↗</span>Laporan</button>
          <button class="nav-link" data-view="settings"><span class="nav-icon">⌑</span>Pengaturan</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="connection-card">
            <span class="connection-dot"></span>
            <div><strong>Mode demo lokal</strong><small>Data tersimpan di browser</small></div>
          </div>
          <button class="reset-button" id="resetDemo">Pulihkan data demo</button>
          <div class="user-card"><span class="avatar" id="userAvatar">AD</span><span><strong id="userName">Belum masuk</strong><small id="userRole">Mode demo</small></span><button class="logout-button" id="logoutButton" type="button" hidden>Keluar</button></div>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumb"><span>Workspace</span><span class="crumb-separator">/</span><strong id="pageLabel">Dashboard</strong></div>
          <div class="topbar-actions"><span class="live-pill"><i></i> MODE LOKAL</span><span id="currentDate" class="date-label"></span><span class="avatar top-avatar">AD</span></div>
        </header>
        <section id="app" class="page-content" aria-live="polite"></section>
        <footer class="footer-note">Prototype operasional lokal · Data contoh, belum tersinkron antarperangkat.</footer>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
